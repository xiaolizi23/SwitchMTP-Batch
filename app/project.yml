# SwitchMTP XcodeGen project spec
# Generated via: xcodegen generate
# Derived from Neighbor-Z/SwiftMTP project.pbxproj (GPL-2.0)
name: SwitchMTPBatch
options:
  bundleIdPrefix: me.fratei
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.7.16"
    CURRENT_PROJECT_VERSION: "42"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

packages: {}

targets:
  SwitchMTP:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: SwitchMTP
        excludes:
          - "**/.DS_Store"
      - path: Shim/NxmtpShim.c
        type: file
      # Resources belong in `sources`: XcodeGen has no `resources:` key and
      # silently ignores one, which previously left the app icon, the
      # localisations and Credits.html out of the built bundle entirely.
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      # Traditional -> Simplified display table (OpenCC derived, ~60 KB).
      - path: Resources/T2S.json
        buildPhase: resources
      # Read by the standard macOS About panel.
      - path: Resources/Credits.html
        type: file
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SwitchMTPBatch
        PRODUCT_BUNDLE_IDENTIFIER: me.fratei.switchmtp.batch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/SwitchMTPBatch.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_OBJC_BRIDGING_HEADER: SwitchMTP/SwitchMTP-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Shim
          - $(SRCROOT)/../backend/build
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../backend/build
          - $(SRCROOT)/../third_party/libusb/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/../backend/build/nxmtp.dylib
          - $(SRCROOT)/../third_party/libusb/lib/libusb-1.0.0.dylib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - SWIFT_PACKAGE=0
        MARKETING_VERSION: "1.7.16"
        CURRENT_PROJECT_VERSION: "42"
    dependencies:
      - sdk: IOKit.framework
      - framework: ../backend/build/nxmtp.dylib
        embed: true
        codeSign: true
      - framework: ../third_party/libusb/lib/libusb-1.0.0.dylib
        embed: true
        codeSign: true
    preBuildScripts: []
    postBuildScripts:
      - name: Bundle hactool
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin"
          mkdir -p "$dest"
          cp -f "$SRCROOT/../tools/hactool/hactool" "$dest/hactool"
          cp -f "$SRCROOT/../tools/hactool/LICENSE" "$dest/hactool-LICENSE.txt"
          cp -f "$SRCROOT/../tools/nszunpack/nszunpack" "$dest/nszunpack"
          cp -f "/opt/homebrew/opt/zstd/LICENSE" "$dest/nszunpack-LICENSE.txt" 2>/dev/null || true
          chmod +x "$dest/hactool" "$dest/nszunpack"

  switchmtp-cli:
    type: tool
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: switchmtp-cli
        excludes:
          - "**/.DS_Store"
      - path: Shim/NxmtpShim.c
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fratei.switchmtp.cli
        SWIFT_OBJC_BRIDGING_HEADER: switchmtp-cli/SwitchMTP-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Shim
          - $(SRCROOT)/../backend/build
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../backend/build
          - $(SRCROOT)/../third_party/libusb/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/../backend/build/nxmtp.dylib
          - $(SRCROOT)/../backend/build/libusb-1.0.0.dylib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path"
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.7.16"
        CURRENT_PROJECT_VERSION: "42"
    dependencies:
      - sdk: IOKit.framework
    postBuildScripts:
      - name: Copy backend dylibs
        script: |
          set -euo pipefail
          cp -f "$SRCROOT/../backend/build/nxmtp.dylib" "$BUILT_PRODUCTS_DIR/nxmtp.dylib"
          cp -f "$SRCROOT/../backend/build/libusb-1.0.0.dylib" "$BUILT_PRODUCTS_DIR/libusb-1.0.0.dylib"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/nxmtp.dylib
          - $(BUILT_PRODUCTS_DIR)/libusb-1.0.0.dylib

schemes:
  SwitchMTP:
    build:
      targets:
        SwitchMTP: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  switchmtp-cli:
    build:
      targets:
        switchmtp-cli: all
    run:
      config: Debug
    archive:
      config: Release
